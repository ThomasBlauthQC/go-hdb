services:
  openldap:
    image: osixia/openldap:latest
    ports:
      - "389:389"
    environment:
      LDAP_ORGANISATION: "Test"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_TLS: "false"
    healthcheck:
      test: ldapsearch -x -H ldap://localhost -b dc=example,dc=com
      interval: 5s
      timeout: 3s
      retries: 5

  hana:
    image: saplabs/hanaexpress:latest
    ports:
      - "39017:39017"
    ulimits:
      nofile: 1048576
    sysctls:
      - kernel.shmmax=1073741824
      - kernel.shmmni=4096
      - kernel.shmall=8388608
    command: --master-password HanaExpress1 --agree-to-sap-license
    healthcheck:
      test: /usr/sap/HXE/HDB90/exe/hdbsql -i 90 -u SYSTEM -p HanaExpress1 -d SYSTEMDB "SELECT 1 FROM DUMMY"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
